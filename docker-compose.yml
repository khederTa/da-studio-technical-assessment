services:
  mongodb:
    image: mongo
    container_name: da-studio-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: kheder_admin
      MONGO_INITDB_ROOT_PASSWORD: super_secure_password
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    container_name: da-studio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./app/api
    container_name: da-studio-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://kheder_admin:super_secure_password@mongodb:27017/da-studio-assessment?authSource=admin
      JWT_SECRET: super_secret_secure_key_for_da_studio_assessment_2026_production_ready
      JWT_EXPIRES_IN: 24h
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
    volumes:
      - ./data:/data
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    build:
      context: ./app/api
    container_name: da-studio-seed
    command: node dist/db/seed.js
    environment:
      MONGO_URI: mongodb://kheder_admin:super_secure_password@mongodb:27017/da-studio-assessment?authSource=admin
    volumes:
      - ./data:/data
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build:
      context: ./app/web
    container_name: da-studio-web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
